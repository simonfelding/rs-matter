name: Flint 2 ARM64 example container

on:
  push:
    branches: [flint2-arm64-container]
    paths:
      - Dockerfile.flint2
      - .dockerignore
      - .github/workflows/flint2-arm64.yml
  workflow_dispatch:
    inputs:
      binary:
        description: Upstream example to package; these are not Home Assistant Matter Servers
        required: true
        default: onoff_light_switch
        type: choice
        options:
          - onoff_light_switch
          - onoff_light
          - dimmable_light

permissions:
  contents: read
  packages: write

concurrency:
  group: flint2-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          BINARY: ${{ inputs.binary || 'onoff_light_switch' }}
        run: |
          image="ghcr.io/${REPOSITORY,,}-flint2-example"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$BINARY-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.flint2
          platforms: linux/arm64
          build-args: BINARY=${{ inputs.binary || 'onoff_light_switch' }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }},push=true,oci-mediatypes=false,compression=gzip,force-compression=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record the built image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: |
          echo "Built ARM64 example: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'This packages an upstream example; it is not a Home Assistant Matter Server.' >> "$GITHUB_STEP_SUMMARY"
